version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: itsm_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-itsm_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-itsm_password_123}
      POSTGRES_DB: ${POSTGRES_DB:-itsm_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-itsm_admin} -d ${POSTGRES_DB:-itsm_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: itsm_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@itsm.local
      PGADMIN_DEFAULT_PASSWORD: admin_password_123
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
    driver: local
